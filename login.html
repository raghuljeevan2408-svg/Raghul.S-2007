<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - PocketSmart</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Login CSS -->
    <link rel="stylesheet"
          href="/static/login.css">

</head>


<body>


    <!-- =====================================
         POCKETSMART BRAND
    ====================================== -->

    <div class="brand-section">

        <h1>
            PocketSmart
        </h1>

        <p>
            AI-Powered Budget Planning
        </p>

    </div>



    <!-- =====================================
         LOGIN CONTAINER
    ====================================== -->

    <main class="login-container">


        <div class="login-card">


            <!-- =================================
                 TITLE
            ================================== -->

            <h2>
                Welcome Back
            </h2>



            <!-- =================================
                 LOGIN FORM
            ================================== -->

            <form
                action="/login"
                method="post"
                class="login-form">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required>

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group password-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>

                </div>



                <!-- FORGOT PASSWORD -->

                <div class="forgot-password">

                    <a href="/forgot-password">
                        Forgot Password?
                    </a>

                </div>



                <!-- SIGN IN BUTTON -->

                <button
                    type="submit"
                    class="signin-button">

                    <span>
                        Sign In
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>



            <!-- =================================
                 CREATE ACCOUNT
            ================================== -->

            <p class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


        </div>

    </main>


</body>

</html>
